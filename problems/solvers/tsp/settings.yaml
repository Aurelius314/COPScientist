task:
  name: tsp
  kind: solver
  objective: min
  entry_function: tsp
  seed_file: seed_solver.py
  instances:
  - tsplib_euc_2d/berlin52.tsp.gz
  - tsplib_euc_2d/eil51.tsp.gz
  - tsplib_euc_2d/st70.tsp.gz
  validation_instances:
  - tsplib_euc_2d/ch130.tsp.gz
  - tsplib_euc_2d/eil76.tsp.gz
  max_instances: 3
  description: solve(instance) returns a zero-based permutation of cities. Distances
    use TSPLIB EUC_2D rounding.
